<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
/* 强制 HTTPS：http 进来立刻换成 https，否则登录会失败 */
(function(){var l=window.location;if(l.protocol!=="http:")return;var h=l.hostname;
if(h==="localhost"||h==="0.0.0.0"||h==="::1"||/^\d+\.\d+\.\d+\.\d+$/.test(h)||h.slice(-6)===".local")return;
l.replace("https://"+l.host+l.pathname+l.search+l.hash);})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排行榜 🏅 曦曦的游戏屋</title>
<meta name="description" content="游戏成绩排行榜 —— 看看谁是小小冠军！">
<meta name="theme-color" content="#fbfef8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/games.css">
<style>
.rk-tip{text-align:center;font-size:14.5px;color:var(--ink-3,#7a8a80);margin:6px 0 18px;}
.rk-tip a{color:#2f9d6d;font-weight:800;}
.rk-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
.rk-tab{padding:8px 14px;border-radius:999px;border:2px solid #d8e8de;background:#fff;
  font-size:13.5px;font-weight:800;color:var(--ink-2,#4a5b52);cursor:pointer;font-family:inherit;}
.rk-tab.is-on{background:#7ed6a8;border-color:#7ed6a8;color:#fff;}
.rk-board{max-width:560px;margin:0 auto;background:var(--paper,#fff);border-radius:20px;
  padding:22px 20px;box-shadow:var(--sh-md,0 10px 30px rgba(0,0,0,.08));}
.rk-board h3{margin:0 0 4px;font-size:19px;color:var(--ink,#33463c);text-align:center;}
.rk-board .rk-sub{text-align:center;font-size:13px;color:var(--ink-3,#7a8a80);margin:0 0 14px;}
.rk-list{list-style:none;margin:0;padding:0;}
.rk-list li{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1.5px dashed #e4f0e9;}
.rk-list li:last-child{border-bottom:none;}
.rk-pos{width:30px;text-align:center;font-size:16px;font-weight:900;color:#9ab0a3;flex:none;}
.rk-list li:nth-child(1) .rk-pos{font-size:19px;}
.rk-name{flex:1;font-size:15.5px;font-weight:800;color:var(--ink,#33463c);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-val{font-size:15.5px;font-weight:900;color:#2f9d6d;flex:none;}
.rk-me{background:#f2fbf6;border-radius:10px;}
.rk-empty{text-align:center;font-size:14.5px;color:var(--ink-3,#7a8a80);padding:18px 0;}
.rk-status{text-align:center;font-size:14.5px;color:var(--ink-2,#4a5b52);font-weight:700;min-height:22px;margin:10px 0;}
</style>
</head>
<body>

<div class="petals" id="petals" aria-hidden="true"></div>

<header class="nav" id="nav">
  <div class="nav__inner">
    <a class="nav__logo" href="index.html">
      <span class="nav__logo-mark">🌸</span>
      <span class="nav__logo-text">曦曦的空间</span>
    </a>
    <nav class="nav__links" id="navLinks">
      <a href="rank.html" class="is-active" aria-current="page">🏅 排行榜</a>
      <a href="admin.html">⚙️ 后台</a>
      <a href="games.html">🎮 游戏屋</a>
      <a href="index.html" class="nav__cta">回首页</a>
      </nav>
    <button class="nav__burger" id="burger" aria-label="打开菜单" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="top">
  <section class="section" style="padding-top:36px;padding-bottom:60px;">
    <div class="wrap">
      <header class="sec-head reveal">
        <p class="sec-head__kicker">Ranking</p>
        <h2 class="sec-head__title">🏅 小小冠军榜</h2>
        <div class="sec-head__line" aria-hidden="true"><span></span><em>🏅</em><span></span></div>
      </header>
      <p class="rk-tip" id="rkTip">登录后才能看排行榜哦～ <a href="login.html">去登录 →</a></p>
      <div class="rk-tabs" id="rkTabs" style="display:none;"></div>
      <div class="rk-board" id="rkBoard" style="display:none;">
        <h3 id="rkTitle">—</h3>
        <p class="rk-sub" id="rkSub"></p>
        <ol class="rk-list" id="rkList"></ol>
        <p class="rk-empty" id="rkEmpty" style="display:none;">这个游戏还没有人上传成绩，快来当第一个冠军吧！🌟</p>
      </div>
      <p class="rk-status" id="rkStatus"></p>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <p class="footer__name">🎮 曦曦的游戏屋</p>
    <p class="footer__line">动动小手和小脑筋，每天都聪明一点点。</p>
    <p class="footer__copy">© <span id="year"></span> 曦曦 · 我的小小游戏屋</p>
  </div>
</footer>

<button class="totop" id="toTop" aria-label="回到顶部">🌸</button>

<script src="assets/js/main.js"></script>
<script src="assets/js/api-config.js"></script>
<script src="assets/js/xixi-api.js"></script>
<script src="assets/js/game-common.js"></script>
<script>
(function () {
  'use strict';
  var tip = document.getElementById('rkTip');
  var tabsEl = document.getElementById('rkTabs');
  var board = document.getElementById('rkBoard');
  var listEl = document.getElementById('rkList');
  var titleEl = document.getElementById('rkTitle');
  var subEl = document.getElementById('rkSub');
  var emptyEl = document.getElementById('rkEmpty');
  var statusEl = document.getElementById('rkStatus');

  var UNIT = { schulte:'秒', jump:'秒', guess:'步', mole:'秒', cancel:'秒', '24':'秒',
               rps:'连胜', eggy:'颗', estimate:'分', flash:'连', round:'分',
               change:'题', poem:'分', angle:'连', guessangle:'题', ratio:'题',
               clock:'题', mirror:'度', mathspeed:'分', mathrush:'题' };

  /* 难度代号翻成人话，和 game-rank.js 里的 LV_NAME 保持一致 */
  var LV_NAME = {
    d1: '⭐ 简单', d2: '⭐⭐ 挑战', d3: '⭐⭐⭐ 高手',
    easy: '⭐ 简单', hard: '⭐⭐ 挑战'
  };

  var ALL = null;     // 全量聚合结果
  var cur = null;     // 当前显示的 tab key
  var myName = null;  // 我的脱敏名（服务端已脱敏，榜单里也是脱敏名，可直接比对）
  var myNameRaw = null; // 我的真实用户名（兜底用）

  function fmtVal(better, v) {
    if (better === 'small' && v >= 1000) return (v / 1000).toFixed(2).replace(/\.?0+$/, '') + ' 秒';
    return String(v);
  }

  function aggregate(data) {
    // 按 gameId+level+username 聚合最佳
    var best = {};
    for (var i = 0; i < data.length; i++) {
      var r = data[i];
      var k = r.gameId + '|' + r.level + '|' + r.username;
      var b = best[k];
      if (!b || (r.better === 'small' ? r.value < b.value : r.value > b.value)) {
        best[k] = { gameId: r.gameId, gameName: r.gameName, level: r.level,
                    better: r.better, username: r.username, value: r.value, createdAt: r.createdAt };
      }
    }
    // 分组：gameId|level
    var groups = {};
    var order = {};
    for (var key in best) {
      if (!Object.prototype.hasOwnProperty.call(best, key)) continue;
      var it = best[key];
      var gk = it.gameId + '|' + it.level;
      (groups[gk] = groups[gk] || []).push(it);
      if (!order[it.gameId] || it.level === 'default') order[it.gameId] = it.gameName;
    }
    var tabs = [];
    for (var gk2 in groups) {
      if (!Object.prototype.hasOwnProperty.call(groups, gk2)) continue;
      var arr = groups[gk2];
      var better = arr[0].better;
      arr.sort(function (a, b2) { return better === 'small' ? a.value - b2.value : b2.value - a.value; });
      tabs.push({ key: gk2, gameId: arr[0].gameId, gameName: arr[0].gameName,
                  level: arr[0].level, better: better, rows: arr });
    }
    tabs.sort(function (a, b3) { return a.gameId < b3.gameId ? -1 : 1; });
    return tabs;
  }

  function levelName(level) {
    if (!level || level === 'default') return '';
    if (Object.prototype.hasOwnProperty.call(LV_NAME, level)) return ' · ' + LV_NAME[level];
    return ' · ' + level + (/\d+x\d+|^\d+$/.test(level) ? ' 档' : '');
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    ALL.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'rk-tab' + (t.key === cur ? ' is-on' : '');
      b.textContent = t.gameName;
      b.addEventListener('click', function () { cur = t.key; renderTabs(); renderBoard(); });
      tabsEl.appendChild(b);
    });
  }

  function renderBoard() {
    var t = null;
    for (var i = 0; i < ALL.length; i++) { if (ALL[i].key === cur) { t = ALL[i]; break; } }
    if (!t) { board.style.display = 'none'; return; }
    board.style.display = 'block';
    titleEl.textContent = t.gameName + (t.level !== 'default' ? '（' + t.level + '）' : '');
    subEl.textContent = t.better === 'small' ? '用时越短越厉害！' : '分数越高越厉害！';
    listEl.innerHTML = '';
    emptyEl.style.display = t.rows.length ? 'none' : 'block';
    var medal = ['🥇', '🥈', '🥉'];
    t.rows.slice(0, 50).forEach(function (row, idx) {
      var li = document.createElement('li');
      if (myName && row.username === myName) li.className = 'rk-me';
      var pos = document.createElement('span');
      pos.className = 'rk-pos';
      pos.textContent = medal[idx] || (idx + 1);
      var name = document.createElement('span');
      name.className = 'rk-name';
      name.textContent = row.username;
      var val = document.createElement('span');
      val.className = 'rk-val';
      val.textContent = fmtVal(t.better, row.value) + (UNIT[t.gameId] ? ' ' + UNIT[t.gameId] : '');
      li.appendChild(pos); li.appendChild(name); li.appendChild(val);
      listEl.appendChild(li);
    });
  }

  function load() {
    statusEl.textContent = '⏳ 正在从服务器取成绩…';
    window.XixiCloud.fetchAllScores(function (res) {
      if (!res.ok) { statusEl.textContent = '😢 ' + res.msg; return; }
      statusEl.textContent = '';
      ALL = fromGroups(res.groups);
      if (!ALL.length) {
        statusEl.textContent = '还没有任何成绩，去玩一局再来看看！';
        return;
      }
      tabsEl.style.display = 'flex';
      cur = ALL[0].key;
      // 默认选中我玩过的
      if (myName) {
        for (var i = 0; i < ALL.length; i++) {
          for (var j = 0; j < ALL[i].rows.length; j++) {
            if (ALL[i].rows[j].username === myName) { cur = ALL[i].key; break; }
          }
        }
      }
      renderTabs();
      renderBoard();
    });
  }

  /* 把服务端返回的分组结构转成页面要用的 tabs */
  function fromGroups(groups) {
    var tabs = [];
    for (var i = 0; i < (groups || []).length; i++) {
      var g = groups[i];
      var rows = g.items || [];
      if (!rows.length) continue;
      tabs.push({
        key: g.gameId + '|' + g.level,
        gameId: g.gameId,
        gameName: rows[0].gameName,
        level: g.level,
        better: rows[0].better,
        rows: rows
      });
    }
    return tabs;
  }

  // 排行榜是公开的，未登录也能看。名字由服务端脱敏（⭐+最后一个字）。
  // 登录后会顺便高亮自己那一行 —— 用脱敏名匹配不上，所以再靠 uid 兜底。
  window.XixiCloud.ready(function (ok) {
    var m = ok ? window.XixiCloud.me() : null;
    if (m) {
      myNameRaw = m.name;
      myName = window.XixiCloud.maskName ? window.XixiCloud.maskName(m.name) : m.name;
      tip.innerHTML = '你好，<b>' + myName + '</b>！你排在下面 <span class="rk-me-dot">•</span> 的位置 <a href="games.html">去玩一局 →</a>';
    } else {
      tip.innerHTML = '下面是全班同学的成绩榜 🎉 <a href="login.html">登录</a>能看到自己的名次';
    }
    load();
  });
})();
</script>
</body>
</html>
